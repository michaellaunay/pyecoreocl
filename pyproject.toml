[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecoreocl"
version = "0.0.1"
description = "Object Constraint Language (OCL) to Python Compiler"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "Vincent Aranega", email = "vincent.aranega@gmail.com"}]
urls = { "Bug Tracker" = "https://github.com/aranega/pyecoreocl", "Homepage" = "https://github.com/aranega/pyecoreocl" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent"
]
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "magic_codec"
]

[tool.setuptools.package-dir]
pyecoreocl = "./pyecoreocl"
magic_ocl = "./magic_ocl"

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pyecore"]

[tool.setuptools.packages.find]
include = ["pyecoreocl*", "magic_ocl*"]

[tool.setuptools.package-data]
"pyecoreocl.parser" = ["*.tokens", "*.interp"]

[tool.setuptools.data-files]
"share/pyecoreocl" = ["OclExpression.g4"]
